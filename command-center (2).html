<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lukas Chang · Summer Command Center</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1116">
<meta name="description" content="Summer 2026 operating system: research, SAT, archery, and systems in one command center.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command Center">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ============================================================
   SUMMER COMMAND CENTER · built for Lukas Chang
   Signature: World Archery target face as the summer progress meter.
   ============================================================ */

:root{
  /* base · deep blue-charcoal, not pure black */
  --ink:#0E1116;
  --ink-1:#11161D;
  --ink-2:#161C25;
  --ink-3:#1C2430;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.12);
  --text:#E7EAEF;
  --text-2:#AEB6C2;
  --muted:#79828F;
  --muted-2:#525B68;

  /* the ten · archery gold, primary accent */
  --gold:#E8B23A;
  --gold-2:#C8902A;
  --gold-soft:rgba(232,178,58,.14);
  --gold-line:rgba(232,178,58,.35);

  /* category system · each hue means a project */
  --c-research:#7C8CF8;
  --c-sat:#4FC0E8;
  --c-archery:#E8B23A;
  --c-adaptive:#46D2A6;
  --c-mcri:#F1739B;
  --c-mcot:#F0944D;
  --c-bio:#AED34B;
  --c-focus:#C9D1DC;

  /* semantic */
  --ok:#46D2A6;
  --warn:#F0B24D;
  --bad:#F0655B;

  /* world archery ring colors (used literally in the target) */
  --ring-gold:#F2C94C;
  --ring-gold-2:#F6D96A;
  --ring-red:#E8503A;
  --ring-blue:#3FA7D9;
  --ring-black:#222932;
  --ring-white:#E9ECF0;

  --rail-w:230px;
  --r:12px;
  --r-sm:9px;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--ink);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
body::before{
  /* faint range-at-dawn atmosphere, top-left light source */
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(232,178,58,.06), transparent 60%),
    radial-gradient(1000px 700px at 100% 110%, rgba(124,140,248,.05), transparent 55%);
}
::selection{background:var(--gold-soft);color:#fff}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- scrollbars ---------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#2a3543}
*::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail-w) 1fr;height:100vh}

/* ---------- left rail ---------- */
.rail{
  background:linear-gradient(180deg,var(--ink-1),var(--ink));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.brand .mark{flex:0 0 auto}
.brand .mark svg{display:block}
.brand .t1{font-weight:680;font-size:13.5px;letter-spacing:.2px;line-height:1.1}
.brand .t2{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}

.nav{flex:1;overflow-y:auto;padding:10px 10px 24px}
.nav-group{margin-top:14px}
.nav-group:first-child{margin-top:6px}
.nav-label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);padding:0 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 10px;border-radius:var(--r-sm);color:var(--text-2);
  font-size:13px;font-weight:500;position:relative;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--muted-2);transition:background .12s,box-shadow .12s}
.nav-item .ico{width:16px;height:16px;flex:0 0 auto;color:var(--muted);display:grid;place-items:center}
.nav-item .ico svg{width:16px;height:16px;display:block}
.nav-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .pct{font-family:var(--mono);font-size:10.5px;color:var(--muted-2)}
.nav-item.active{background:var(--ink-3);color:#fff}
.nav-item.active .ico{color:var(--gold)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--gold)}

/* ---------- main column ---------- */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}

/* instrument top bar */
.topbar{
  display:flex;align-items:center;gap:18px;padding:0 22px;height:58px;
  border-bottom:1px solid var(--line);background:rgba(14,17,22,.7);backdrop-filter:blur(8px);flex:0 0 auto;
}
.tb-date{display:flex;flex-direction:column;line-height:1.15}
.tb-date .d1{font-weight:600;font-size:14px}
.tb-date .d2{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tb-phase{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:20px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.tb-spacer{flex:1}
.tb-stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;cursor:default}
.tb-stat .v{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.tb-stat .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tb-sep{width:1px;height:26px;background:var(--line)}
.tb-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--text-2);transition:.12s}
.tb-btn:hover{background:var(--ink-3);color:#fff;border-color:var(--line-2)}
.tb-btn svg{width:15px;height:15px}

/* content scroll area */
.view{flex:1;overflow-y:auto;padding:24px 26px 60px}
.view-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.view-title{font-size:22px;font-weight:680;letter-spacing:-.01em}
.view-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.view-sub{color:var(--muted);font-size:13px}
.vh-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.span-2{grid-column:span 2}
@media(max-width:1180px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g-2,.g-3,.g-4{grid-template-columns:1fr}.span-2{grid-column:span 1}}

.card{
  background:linear-gradient(180deg,var(--ink-2),var(--ink-1));
  border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;
}
.card.pad-lg{padding:22px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .ttl{font-size:13.5px;font-weight:640;letter-spacing:.01em}
.card-h .sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--text-2)}
.swatch{width:8px;height:8px;border-radius:2px;flex:0 0 auto}

.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}

/* stat number */
.stat .n{font-family:var(--mono);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1;font-variant-numeric:tabular-nums}
.stat .n small{font-size:15px;color:var(--muted);font-weight:500}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.stat .delta{font-family:var(--mono);font-size:11px;margin-top:5px}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}

/* progress bar */
.bar{height:7px;border-radius:20px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.bar > span{position:absolute;left:0;top:0;bottom:0;border-radius:20px;background:var(--gold);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar.tall{height:9px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .nm{flex:0 0 auto;font-size:12.5px;color:var(--text-2);width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bar{flex:1}
.bar-row .pc{font-family:var(--mono);font-size:11px;color:var(--muted);width:34px;text-align:right;flex:0 0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-2);color:var(--text);font-size:12.5px;font-weight:560;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--ink-3);border-color:rgba(255,255,255,.2)}
.btn svg{width:14px;height:14px}
.btn.gold{background:var(--gold);color:#1a1304;border-color:var(--gold);font-weight:640}
.btn.gold:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.icon{padding:6px;width:30px;height:30px;justify-content:center}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line-2);color:var(--text-2)}
.badge .bd{width:6px;height:6px;border-radius:50%}
.badge.ok{color:var(--ok);border-color:rgba(70,210,166,.4)} .badge.ok .bd{background:var(--ok)}
.badge.warn{color:var(--warn);border-color:rgba(240,178,77,.4)} .badge.warn .bd{background:var(--warn)}
.badge.bad{color:var(--bad);border-color:rgba(240,101,91,.4)} .badge.bad .bd{background:var(--bad)}
.badge.mut{color:var(--muted)} .badge.mut .bd{background:var(--muted-2)}

/* check item */
.chk{display:flex;align-items:flex-start;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
.chk:last-child{border-bottom:none}
.chk:hover{background:rgba(255,255,255,.015)}
.chk .box{flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1.6px solid var(--line-2);margin-top:1px;display:grid;place-items:center;transition:.12s}
.chk .box svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:.14s;color:#16110a}
.chk.done .box{background:var(--gold);border-color:var(--gold)}
.chk.done .box svg{opacity:1;transform:scale(1)}
.chk .txt{flex:1;font-size:13px;color:var(--text);transition:.12s}
.chk.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted-2)}
.chk .meta{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.chk .sidecat{width:3px;align-self:stretch;border-radius:3px;flex:0 0 auto}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);font-weight:500;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl .mut{color:var(--muted)}

/* inputs */
.inp{background:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;width:100%;font-size:13px;transition:.12s}
.inp:focus{outline:none;border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.55}
.field-row{display:flex;gap:8px;align-items:center}
label.fl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}

/* segmented (rating dots) */
.dots{display:inline-flex;gap:5px}
.dots .d{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);cursor:pointer;transition:.12s}
.dots .d.on{background:var(--gold);border-color:var(--gold)}
.dots .d:hover{border-color:var(--gold-line)}

/* mastery meter (5 segs) */
.segs{display:flex;gap:3px}
.segs .s{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.07);cursor:pointer;transition:.12s}
.segs .s.on{background:var(--cat,var(--gold))}

/* pills group */
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);color:var(--text-2);cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--line-2)}
.pill.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.pill.on .pdot{background:var(--gold)}
.pill .pdot{width:6px;height:6px;border-radius:50%;background:var(--muted-2)}

/* timeline (day schedule) */
.tl{position:relative;padding-left:62px}
.tl .row{position:relative;display:flex;gap:12px;align-items:stretch;padding:3px 0}
.tl .time{position:absolute;left:-62px;top:6px;width:52px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tl .blk{flex:1;border-radius:9px;border:1px solid var(--line);background:var(--ink-2);padding:9px 12px;display:flex;align-items:center;gap:10px;transition:.12s;border-left-width:3px}
.tl .blk:hover{border-color:var(--line-2)}
.tl .blk.done{opacity:.5}
.tl .blk .bl-t{font-size:12.5px;font-weight:550}
.tl .blk .bl-s{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tl .blk .mini-box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:0 0 auto}
.tl .blk.done .mini-box{background:var(--gold);border-color:var(--gold)}
.tl .blk.done .mini-box svg{color:#16110a;width:10px;height:10px}
.tl .blk .mini-box svg{opacity:0}
.tl .blk.done .mini-box svg{opacity:1}
.tl .blk.locked{border-style:dashed;cursor:default}
.tl .blk.locked .lockicon{color:var(--muted-2)}

/* month calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cdow{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cal .cell{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:7px;position:relative;background:var(--ink-1);transition:.12s;cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cal .cell:hover{border-color:var(--line-2);background:var(--ink-2)}
.cal .cell.out{opacity:.32}
.cal .cell.today{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-line) inset}
.cal .cell .dn{font-family:var(--mono);font-size:12px;font-weight:600}
.cal .cell .dn.wk{color:var(--muted)}
.cal .cell .evt{font-size:9.5px;line-height:1.25;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--cat,var(--gold));background:rgba(255,255,255,.03)}
.cal .cell .more{font-family:var(--mono);font-size:9px;color:var(--muted)}
.cal .cell .ti{position:absolute;top:6px;right:7px;font-family:var(--mono);font-size:8px;letter-spacing:.06em;color:var(--muted-2);text-transform:uppercase}

/* hero target */
.hero{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.target-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.target-svg{width:100%;max-width:280px}
.target-cap{text-align:center}
.target-cap .big{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
.target-cap .big small{font-size:16px;color:var(--muted)}
.target-cap .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}

/* conditions list (success conditions) */
.cond{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.cond:last-child{border-bottom:none}
.cond .ci{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line-2)}
.cond .ci svg{width:14px;height:14px}
.cond .cmid{flex:1;min-width:0}
.cond .cnm{font-size:13px;font-weight:550}
.cond .cst{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.cond .cbar{width:120px;flex:0 0 auto}
.cond .cpc{font-family:var(--mono);font-size:13px;width:42px;text-align:right;flex:0 0 auto;font-weight:600}

/* impact / score group plot */
.plot-svg{width:100%;display:block}

/* alert / conflict cards */
.alert{display:flex;gap:12px;padding:13px 15px;border-radius:10px;border:1px solid;background:rgba(255,255,255,.02);align-items:flex-start}
.alert.warn{border-color:rgba(240,178,77,.32);background:rgba(240,178,77,.05)}
.alert.bad{border-color:rgba(240,101,91,.32);background:rgba(240,101,91,.05)}
.alert.info{border-color:var(--line-2)}
.alert .ai{flex:0 0 auto;margin-top:1px}
.alert .ai svg{width:17px;height:17px}
.alert.warn .ai{color:var(--warn)} .alert.bad .ai{color:var(--bad)} .alert.info .ai{color:var(--c-sat)}
.alert .at{font-size:12.5px;font-weight:600;margin-bottom:3px}
.alert .ab{font-size:12px;color:var(--text-2);line-height:1.5}
.alert .ab b{color:var(--text);font-weight:600}

/* streak / habit grid */
.hgrid{display:grid;grid-template-columns:130px repeat(7,1fr);gap:5px;align-items:center}
.hgrid .hh{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.hgrid .hn{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px}
.hgrid .hn .sw{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.hcell{height:26px;border-radius:6px;border:1px solid var(--line);background:var(--ink-1);cursor:pointer;display:grid;place-items:center;transition:.1s}
.hcell:hover{border-color:var(--line-2)}
.hcell.on{background:var(--cat,var(--gold));border-color:transparent}
.hcell.on svg{width:12px;height:12px;color:#16110a}
.hcell svg{opacity:0}
.hcell.on svg{opacity:1}
.hcell.fut{opacity:.3;cursor:default}
.streak-pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold);font-weight:600}

/* countdown */
.cd{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.cd:last-child{border-bottom:none}
.cd.past{opacity:.4}
.cd .cdcat{width:4px;align-self:stretch;border-radius:4px;flex:0 0 auto}
.cd .cdmid{flex:1;min-width:0}
.cd .cdnm{font-size:13.5px;font-weight:560}
.cd .cddt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.cd .cdnum{font-family:var(--mono);text-align:right;flex:0 0 auto}
.cd .cdnum .v{font-size:21px;font-weight:600;line-height:1}
.cd .cdnum .u{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cd .cdnum.soon .v{color:var(--gold)}
.cd .cdnum.live .v{color:var(--ok)}

/* deep work timer */
.timer-face{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.timer-ctrl{display:flex;gap:10px;justify-content:center;margin-top:16px}
.ring-prog{transform:rotate(-90deg);transform-origin:center}

/* publication status flow */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow .step{font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.flow .step.done{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.flow .step.cur{border-color:var(--text-2);color:var(--text)}
.flow .arr{color:var(--muted-2);font-size:10px}

/* small note text */
.note{font-size:11.5px;color:var(--muted);line-height:1.5}
.kvs{display:flex;flex-direction:column;gap:9px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-3);border:1px solid var(--line-2);border-radius:10px;padding:11px 16px;font-size:12.5px;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ti{color:var(--gold)}
.toast .ti svg{width:15px;height:15px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,8,11,.66);backdrop-filter:blur(3px);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--ink-2);border:1px solid var(--line-2);border-radius:14px;width:100%;max-width:460px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal h3{font-size:15px;font-weight:640;margin-bottom:4px}
.modal .msub{font-size:12px;color:var(--muted);margin-bottom:16px}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* tiny inline add row */
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .inp{flex:1}

/* empty */
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:12.5px}

/* phase ribbon for sleep */
.phase-strip{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.phase-strip .ps{flex:1;padding:11px 12px;border-right:1px solid var(--line);position:relative}
.phase-strip .ps:last-child{border-right:none}
.phase-strip .ps.active{background:var(--gold-soft)}
.phase-strip .ps .pst{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.phase-strip .ps .psd{font-size:10.5px;color:var(--muted);margin-top:3px}

/* responsive rail collapse */
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:120;transform:translateX(-100%);transition:transform .2s}
  .rail.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.6)}
  .menu-btn{display:grid !important}
}
.menu-btn{display:none}

/* focus visibility */
:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px}

@media(prefers-reduced-motion:reduce){

}

/* utility */

.tr{text-align:right} .tc{text-align:center}
.muted{color:var(--muted)} .small{font-size:11.5px}

const DAY=86400000;

function pd(s){return new Date(s+'T12:00:00');}            // parse iso -> local noon
function iso(d){const z=new Date(d);z.setHours(12,0,0,0);const m=String(z.getMonth()+1).padStart(2,'0');const day=String(z.getDate()).padStart(2,'0');return z.getFullYear()+'-'+m+'-'+day;}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function dow(s){return pd(s).getDay();}
function fmtShort(s){const d=pd(s);return WD[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate();}
function fmtLong(s){const d=pd(s);return WDL[d.getDay()]+', '+MOL[d.getMonth()]+' '+d.getDate();}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/DAY);}
function clampDate(s,lo,hi){if(s<lo)return lo;if(s>hi)return hi;return s;}
function realToday(){return iso(new Date());}
function weekStart(s){const d=pd(s);const off=d.getDay();return addD(s,-off);} // sunday-start

function wakeMin(s){const ph=phaseOf(s).key;if(ph==='ltri'||ph==='sat')return 5*60;if(ph==='post')return 6*60;return 5*60+30;}
function ensureDay(s){
  if(S.days[s])return S.days[s];

function genDay(s){
  const ph=phaseOf(s);const w=wakeMin(s);const comps=compsOn(s);const isSatDay=(s===SAT_DAY);const isComp=comps.length>0&&!isSatDay;
  const ltri=isLTRIDay(s)&&!isSatDay;const cls=classesOn(s);const d=dow(s);const weekend=(d===0||d===6);
  const main=ARCH_MAIN[d];
  const hasMain=!!main&&!isComp&&!isSatDay&&!(ltri&&d===3); // Wed main cannot run on an internship day
  const blocks=[];let bn=0;
  const push=(st,en,t,cat,locked)=>blocks.push({id:'b'+(bn++),start:st,end:en,t,cat,done:false,locked:!!locked});

  // morning prime, all phases
  push(w,w+40,'Wake · hydrate · light mobility','routine',true);

  if(isSatDay){
    push(w+40,w+90,'Test-day fuel + calm warm-up','routine');
    push(w+90,w+120,'Light review: formula sheet, no new material','sat');
    push(w+120,w+160,'Travel to test center','routine',true);
    push(8*60,12*60+30,'SAT Official Test','sat',true);
    push(12*60+30,13*60+30,'Decompress + lunch','routine');
    push(14*60,15*60+30,'Easy archery or full rest','archery');
    push(16*60,16*60+45,'Bank the win, light reset','routine');
  }else if(isComp){
    const cmp=comps[0];
    push(w+40,w+100,'Fuel + gear check','routine');
    push(w+100,w+160,'Travel to range','routine',true);
    push(w+160,w+220,'Warm-up: blank bale → sighters','archery');
    push(w+220,w+400,cmp.name+' · qualify / matches','archery',true);
    push(w+400,w+460,'Cooldown + log scores and notes','archery');
    push(20*60,20*60+45,'SAT: light vocab review only','sat');
  }else if(hasMain){
    const ms=t2m(main.start),me=t2m(main.end),cm=main.commute;
    const leave=ms-cm-25;
    if(d===0){ // Sunday: leave early, study lands on the road
      push(w+40,Math.max(w+55,leave),'Light fuel + gear prep','routine');
    }else{ // Wednesday (pre/post): full morning of deep work, afternoon practice
      push(w+40,9*60,'Research deep work (Atlas / NeuroTraject)','research');
      push(9*60+15,11*60,'SAT: timed section + error log','sat');
      push(11*60,12*60+30,'Adaptive impact task of the day','adaptive');
      push(13*60,leave,'Lunch + reset','routine');
    }
    push(leave,ms-cm,'Pack gear, fuel, leave','routine',true);
    push(ms-cm,ms,main.out,main.outCat);
    push(ms,me,main.label,'archery',true);
    push(me,me+cm,main.in,main.inCat);
  }else if(ltri){
    push(w+40,8*60,'Deep block: research prep / Atlas reading','research');
    push(8*60+30,9*60,'Commute to LTRI','routine',true);
    push(9*60,12*60+30,'LTRI · wet lab + dry lab','research',true);
    push(12*60+30,13*60,'Lunch + decompress','routine');
    push(13*60,16*60,'LTRI · CRISPR Atlas analysis','research',true);
    push(16*60,16*60+30,'Commute home','routine',true);
    // archery window before evening class
    const firstClass=cls.length?Math.min(...cls.map(c=>t2m(c.start))):20*60;
    if(firstClass-16*60-45>=60)push(16*60+45,Math.min(firstClass-15,18*60+15),'Archery: 100 arrows · release focus','archery');
    else push(16*60+45,17*60+30,'Archery: short technical set','archery');
  }else if(weekend){
    push(w+40,9*60,'Archery: long quality session','archery');
    push(9*60+30,11*60+30,'Research deep work (Atlas / NeuroTraject)','research');
    if(d===0)push(13*60,17*60,'SAT: full timed practice test','sat');
    else push(13*60,14*60+30,'SAT: 2 timed modules','sat');
    push(15*60,16*60+30,'MCRI / MCOT systems build','mcri');
  }else{ // pre or post non-LTRI weekday
    const prep=ph.key==='pre';
    push(w+40,8*60+15,'Research deep work block','research');
    push(8*60+30,9*60+30,prep?'Research prep topic of the day':'Atlas → bioRxiv work','research');
    push(10*60,11*60+30,'SAT: timed section + error log','sat');
    push(13*60,14*60+30,'Archery: 100 arrows · release focus','archery');
    push(15*60,16*60+30,ph.key==='post'?'Bio Olympiad ramp':'Adaptive impact report','adaptive');
  }
  // evening classes (locked, fixed)
  cls.forEach(c=>push(t2m(c.start),t2m(c.end),c.name+(c.adj?' (adjustable)':''),c.cat,true));
  // lights-out marker
  const lo=cls.length?Math.max(22*60+30,Math.max(...cls.map(c=>t2m(c.end)))+30):21*60;
  push(lo,lo+30,'Wind-down · lights out','routine',true);
  blocks.sort((a,b)=>a.start-b.start);

  // top 3
  let top3;
  if(isSatDay)top3=['Execute the SAT, every section','Trust the prep, manage the clock','This is the one that moves 1600'];
  else if(isComp)top3=['Execute the shot, not the scoreboard','Arrow-by-arrow process focus','Log every end + notes after'];
  else if(hasMain)top3=[(d===0?'Long main practice: quality over volume':'Main practice: relaxed hand, strong release'),'Bank study on the commute (SAT + research)','Adaptive impact task of the day done'];
  else if(ph.key==='pre')top3=['Research prep topic locked','SAT: 1 module + error log','Archery: quality 100, relaxed hand'];
  else if(ph.key==='ltri')top3=['LTRI: advance CRISPR Atlas','SAT: timed RW set + error log','Archery: arrows or active recovery'];
  else if(ph.key==='sat')top3=['SAT: full section / test block','Research: Atlas → bioRxiv','Archery: hold the 615 line'];
  else top3=['SAT debrief → Bio Olympiad ramp','Atlas: draft → preprint','Adaptive: impact report'];

  // checklist (daily non-negotiables)
  const chk=[
    {t:'SAT daily set',cat:'sat'},
    {t:'Error review (yesterday\u2019s misses)',cat:'sat'},
    {t:'Vocabulary · 5 words in context',cat:'sat'},
    {t:'Arrows or active recovery logged',cat:'archery'},
    {t:'No morning scroll',cat:'focus'},
    {t:'Lights out by target',cat:'routine'},
  ];
  if(ltri)chk.splice(3,0,{t:'Atlas analysis logged',cat:'research'});
  if(ph.key==='pre')chk.splice(0,0,{t:'Research prep topic',cat:'research'});

  // deep work plan
  let dw;
  if(isSatDay)dw=[{t:'SAT Official Test',plan:135,done:false}];
  else if(isComp)dw=[{t:'Score + notes review',plan:30,done:false}];
  else if(hasMain)dw=[{t:'Commute study: SAT + research',plan:90,done:false},{t:'Range: process-focus block',plan:60,done:false}];
  else if(ph.key==='ltri')dw=[{t:'CRISPR Atlas analysis',plan:120,done:false},{t:'SAT timed set',plan:35,done:false}];
  else if(ph.key==='sat')dw=[{t:'SAT timed block',plan:60,done:false},{t:'Research push',plan:75,done:false}];
  else if(weekend)dw=[{t:'Research deep work',plan:120,done:false},{t:'SAT practice',plan:90,done:false}];
  else dw=[{t:'Research deep work',plan:90,done:false},{t:'SAT module',plan:45,done:false}];

  return{
    generated:true,
    top3:top3.map(t=>({t,done:false})),
    blocks,
    checklist:chk.map(c=>({t:c.t,cat:c.cat,done:false})),
    deepwork:dw,
    reflection:{wins:'',blockers:'',tomorrow:'',rating:0},
    arrows:0,
  };
}

function pct(done,total){return total?Math.round(done/total*100):0;}
function msPct(arr){return pct(arr.filter(m=>m.done).length,arr.length);}
function satLatest(){const t=S.data.sat.tests;return t.length?t[t.length-1].total:S.data.sat.baseline;}
function satBest(){return Math.max(...S.data.sat.tests.map(t=>t.total),S.data.sat.baseline);}
function clampPct(x){return Math.max(0,Math.min(100,Math.round(x)));}
function satPct(){return clampPct((satLatest()-1520)/(1600-1520)*100);}
function archBest(){return Math.max(S.data.archery.pb,...S.data.archery.sessions.map(s=>s.score));}
function arch615Count(){return S.data.archery.sessions.filter(s=>s.score>=615).length;}
function archPct(){const prox=Math.max(0,Math.min(1,(archBest()-590)/(615-590)));const cnt=Math.min(arch615Count()/2,1);return clampPct((prox*.5+cnt*.5)*100);}
function arrowsTotal(){return S.data.archery.sessions.reduce((a,s)=>a+s.arrows,0)+Object.values(S.days).reduce((a,d)=>a+(d.arrows||0),0);}
function mcotAvg(){const ss=S.data.mcot.subjects;if(!ss.length)return 0;return Math.round(ss.reduce((a,s)=>a+(s.curriculum+s.resources+s.video)/3,0)/ss.length);}
function mcriCombined(){return Math.round((msPct(S.data.mcri.milestones)+mcotAvg())/2);}

/* ---------- SIGNATURE: World Archery target as progress meter ---------- */
function targetSVG(cond,opts){
  opts=opts||{};const S2=240,c=120,R=110;
  const ringFill=[ [1.0,'var(--ring-white)'],[0.8,'var(--ring-black)'],[0.6,'var(--ring-blue)'],[0.4,'var(--ring-red)'],[0.2,'var(--ring-gold)'] ];
  let g='<svg class="target-svg" viewBox="0 0 '+S2+' '+S2+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Summer progress target">';
  g+='<defs><radialGradient id="goldg" cx="50%" cy="42%" r="60%"><stop offset="0%" stop-color="var(--ring-gold-2)"/><stop offset="100%" stop-color="var(--ring-gold)"/></radialGradient></defs>';
  ringFill.forEach(([f,col])=>{g+='<circle cx="'+c+'" cy="'+c+'" r="'+(f*R)+'" fill="'+(col==='var(--ring-gold)'?'url(#goldg)':col)+'"/>';});
  // hairline ring separators (10 rings)
  for(let i=1;i<=9;i++)g+='<circle cx="'+c+'" cy="'+c+'" r="'+((i/10)*R)+'" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="0.7"/>';
  g+='<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>';
  // X ring
  g+='<circle cx="'+c+'" cy="'+c+'" r="6" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="0.8"/>';
  // impacts · one per success condition, radius maps to (1 - pct)
  const base=-Math.PI/2;
  cond.forEach((co,i)=>{
    const ang=base+(i-(cond.length-1)/2)*0.52;
    const rad=(1-co.pct/100)*0.82*R;
    const x=c+Math.cos(ang)*rad, y=c+Math.sin(ang)*rad;
    g+='<circle cx="'+x+'" cy="'+y+'" r="6.2" fill="rgba(8,10,14,.55)"/>';
    g+='<circle cx="'+x+'" cy="'+y+'" r="4.4" fill="'+co.cat_hex+'" stroke="#0b0d12" stroke-width="1.2"/>';
  });
  return g+'</svg>';
}

function scoreGroupSVG(sessions){
  const S2=180,c=90,R=78;const lo=560,hi=625;
  const ringFill=[[1.0,'var(--ring-white)'],[0.8,'var(--ring-black)'],[0.6,'var(--ring-blue)'],[0.4,'var(--ring-red)'],[0.2,'var(--ring-gold)']];
  let g='<svg class="plot-svg" viewBox="0 0 '+S2+' '+S2+'" xmlns="http://www.w3.org/2000/svg">';
  ringFill.forEach(([f,col])=>g+='<circle cx="'+c+'" cy="'+c+'" r="'+(f*R)+'" fill="'+col+'"/>');
  for(let i=1;i<=9;i++)g+='<circle cx="'+c+'" cy="'+c+'" r="'+((i/10)*R)+'" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="0.6"/>';
  const recent=sessions.slice(-10);
  recent.forEach((s,i)=>{
    const norm=Math.max(0,Math.min(1,(s.score-lo)/(hi-lo)));   // 0..1 toward center
    const rad=(1-norm)*0.84*R;const ang=(i/recent.length)*Math.PI*2 - Math.PI/2;
    const x=c+Math.cos(ang)*rad,y=c+Math.sin(ang)*rad;
    const isBest=s.score===Math.max(...sessions.map(z=>z.score));
    g+='<circle cx="'+x+'" cy="'+y+'" r="'+(isBest?5:4)+'" fill="'+(isBest?'#fff':'var(--c-archery)')+'" stroke="#0b0d12" stroke-width="1.1"/>';
  });
  return g+'</svg>';
}

/* ---------- generic line chart (scores / sat) ---------- */
function lineChart(points,opts){
  // points: [{x:iso,y:num}] ; opts:{from,to,ymin,ymax,target,color,proj,fmtY}
  const W=560,H=180,pl=44,pr=14,pt=16,pb=26;
  const x0=pl,x1=W-pr,y0=H-pb,y1=pt;
  const from=opts.from,to=opts.to,ymin=opts.ymin,ymax=opts.ymax;
  const sx=t=>{const f=(pd(t)-pd(from))/(pd(to)-pd(from));return x0+Math.max(0,Math.min(1,f))*(x1-x0);};
  const sy=v=>{const f=(v-ymin)/(ymax-ymin);return y0-Math.max(0,Math.min(1,f))*(y0-y1);};
  let g='<svg class="plot-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  // y gridlines
  const ticks=opts.yticks||[ymin,Math.round((ymin+ymax)/2),ymax];
  ticks.forEach(v=>{const y=sy(v);g+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="rgba(255,255,255,.06)"/>';g+='<text x="'+(x0-8)+'" y="'+(y+3)+'" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--muted)">'+(opts.fmtY?opts.fmtY(v):v)+'</text>';});
  // target line
  if(opts.target!=null){const y=sy(opts.target);g+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--gold)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".8"/>';g+='<text x="'+(x1)+'" y="'+(y-5)+'" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--gold)">target '+opts.target+'</text>';}
  const col=opts.color||'var(--gold)';
  if(points.length){
    let path='';points.forEach((p,i)=>{path+=(i?'L':'M')+sx(p.x)+' '+sy(p.y);});
    g+='<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
    // projection
    if(opts.proj&&points.length>=1){
      const last=points[points.length-1];let projY=last.y;
      if(points.length>=2){const a=points[0],b=last;const slope=(b.y-a.y)/((pd(b.x)-pd(a.x))/DAY||1);projY=last.y+slope*((pd(to)-pd(last.x))/DAY);}
      projY=Math.max(ymin,Math.min(ymax,projY));
      g+='<path d="M'+sx(last.x)+' '+sy(last.y)+'L'+sx(to)+' '+sy(projY)+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-dasharray="3 4" opacity=".6"/>';
      g+='<circle cx="'+sx(to)+'" cy="'+sy(projY)+'" r="3" fill="none" stroke="'+col+'" stroke-width="1.4"/>';
      g+='<text x="'+(sx(to))+'" y="'+(sy(projY)-7)+'" text-anchor="end" font-family="var(--mono)" font-size="9" fill="'+col+'">proj '+Math.round(projY)+'</text>';
    }
    points.forEach(p=>{g+='<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="3.5" fill="'+col+'" stroke="#0b0d12" stroke-width="1"/>';});
  }
  // x labels (from / mid / to)
  [from,opts.to].forEach((t,i)=>{g+='<text x="'+(i?x1:x0)+'" y="'+(H-8)+'" text-anchor="'+(i?'end':'start')+'" font-family="var(--mono)" font-size="9" fill="var(--muted)">'+fmtShort(t)+'</text>';});
  return g+'</svg>';
}

/* conflicts that apply to a given day */
function dayConflicts(s){
  const out=[];
  const d=dow(s);const cls=classesOn(s);const comps=compsOn(s);const ltri=isLTRIDay(s);
  const inPeriod=s>=PERIOD.start&&s<=PERIOD.end;
  if(s===SAT_DAY)out.push(['bad','warn','SAT test day vs Moyers','The Aug 22 SAT and a Moyers tournament fall on the same day. Per priority order, the SAT takes the day. Skip Moyers or send a B-team result.']);
  // Wednesday archery main vs Crimson SAT
  const hasCrim=cls.some(c=>c.id==='crimson');
  if(d===3&&!ltri&&!comps.length&&s!==SAT_DAY&&hasCrim&&inPeriod)
    out.push(['bad','warn','Archery main vs Crimson SAT','Wednesday main practice (5 to 8pm, 2h each way) runs straight through Crimson SAT (6 to 8pm). Pick one per Wednesday: attend Crimson live and shorten or relocate practice, or shoot and catch Crimson by recording.']);
  // Wednesday main practice during the internship block
  if(d===3&&ltri&&inPeriod)
    out.push(['warn','warn','Wednesday practice vs internship','LTRI runs 9 to 4, so a 5pm practice 2h away does not fit on internship Wednesdays. Use a local session those weeks, or move the midweek main practice.']);
  // Long Sunday
  if(d===0&&ARCH_MAIN[0]&&!comps.length&&inPeriod)
    out.push(['info','clock','Long Sunday','Practice 9 to 1:30 plus 2h each way, then Calculus 4 to 6:30. Bank SAT and reading across the 4 commute hours, and guard recovery that night.']);
  // competition on an internship day
  if(comps.length&&ltri)out.push(['warn','warn',comps[0].name+' on an internship day',comps[0].name+' lands on an LTRI weekday. Pre-arrange time off with the lab now, not the week of.']);
  // sleep math
  if(cls.length&&phaseOf(s).key!=='post'){
    const latest=Math.max(...cls.map(c=>t2m(c.end)));
    if(latest>=21*60+30)out.push(['info','sleep','Sleep math is tight','A 5am wake with class ending '+m2t(latest)+' leaves under 7h even with lights out right after. Protect the wind-down or shift the wake on class nights.']);
  }
  return out;
}

function impactCardHTML(s){
  const e=impactFor(s);if(!e)return '';

  let body='';
  if(e.gate)body+=alertBox('warn','warn',e.gate,'This window only opens if the archery MQS is already secured. If not, it defers to an MQS-chase event.');
  if(e.note&&typeof e.note==='string')body+='<div class="note" style="margin-bottom:10px">'+e.note+'</div>';
  let rows='';
  if(e.note===true){
    rows='<div class="note">'+e.tasks.join('  ')+'</div>';
  }else if(e.recurring){
    rows+=impRow(s+'::imp::att','Log attendance now, 15 min, this session (integrity backbone)');
    if(dow(s)===0||dow(s)===6){(e.weekend||[]).forEach((t,i)=>{rows+=impRow(s+'::impw::'+i,t);});}

  return card('Adaptive Impact · today',sub,body,{icon:'adaptive',cat:'adaptive',span:true,right:tag?'<span class="card-tag">'+tag+'</span>':''});
}

    dayBars+='<div class="tc"><div style="height:80px;display:flex;align-items:flex-end;justify-content:center"><div style="width:60%;background:linear-gradient(180deg,var(--gold),var(--gold-2,#c8902a));border-radius:4px 4px 0 0;height:'+Math.max(3,cp)+'%;transition:.4s"></div></div><div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:5px">'+WD[dow(ds)]+'</div><div style="font-family:var(--mono);font-size:10px">'+cp+'%</div></div>';}
  dayBars+='</div>';
  h+=card('Daily Completion','non-negotiables hit per day',dayBars,{icon:'review',cls:'mt16'});
  return h;
}

/* ============================================================
   RENDER DISPATCHER
   ============================================================ */
const VIEWS={today:viewToday,week:viewWeek,month:viewMonth,progress:viewProgress,
  sat:viewSat,research:viewResearch,archery:viewArchery,adaptive:viewAdaptive,
  mcri:viewMcri,mcot:viewMcot,bio:viewBio,habits:viewHabits,deepwork:viewDeepwork,
  pubs:viewPubs,countdown:viewCountdown,review:viewReview};
function render(){
  const fn=VIEWS[S.view]||viewToday;
  $('view').innerHTML=fn();
  $('view').scrollTop=0;
}
function refresh(){renderRail();renderTop();render();}
function mutate(fn){fn();save();maybeBackup();refresh();}

/* ============================================================
   TIMER  (live, not persisted as running)
   ============================================================ */
function updateTimerDOM(){
  const face=document.querySelector('.timer-face');if(!face)return;
  const t=S.timer;const mm=String(Math.floor(t.remaining/60)).padStart(2,'0');const ss=String(t.remaining%60).padStart(2,'0');
  face.textContent=mm+':'+ss;
  const ring=document.querySelector('.ring-prog');
  if(ring){const C=2*Math.PI*52;const frac=t.length?t.remaining/t.length:0;ring.setAttribute('stroke-dashoffset',(C*(1-frac)).toFixed(1));}
}
function tickTimer(){
  if(!TIMER.running)return;
  if(S.timer.remaining>0){S.timer.remaining--;updateTimerDOM();}
  if(S.timer.remaining<=0){
    TIMER.running=false;
    const mins=Math.round(S.timer.length/60);
    S.dw.log.push({date:realToday(),label:S.timer.label,minutes:mins});
    // mark a matching planned block done if present
    const dy=ensureDay(realToday());const m=dy.deepwork.find(d=>!d.done);if(m)m.done=true;
    save();toast(mins+' min logged');refresh();
  }
}
setInterval(tickTimer,1000);

/* live countdowns */
function refreshCountdowns(){
  document.querySelectorAll('[data-cd-num]').forEach(el=>{
    const date=el.getAttribute('data-cd-num');
    const now=new Date();const target=new Date(date+'T08:00:00');
    let diff=Math.floor((target-now)/1000);
    const v=el.querySelector('.v'),u=el.querySelector('.u');
    if(diff<=0){const ended=new Date(date+'T23:59:59');if(now<ended){el.classList.add('live');v.textContent='LIVE';u.textContent='today';}else{v.textContent='done';u.textContent='';el.classList.remove('soon');}return;}
    const days=Math.floor(diff/86400);diff%=86400;const hrs=Math.floor(diff/3600);diff%=3600;const mins=Math.floor(diff/60);
    if(days>=2){v.textContent=days;u.textContent='days';}
    else if(days>=1){v.textContent=days+'d '+hrs+'h';u.textContent='left';el.classList.add('soon');}
    else{v.textContent=hrs+':'+String(mins).padStart(2,'0');u.textContent='hrs';el.classList.add('soon');}
    if(days<=7)el.classList.add('soon');
  });
}
setInterval(()=>{if(S.view==='countdown')refreshCountdowns();},1000);

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='lukas-command-center-'+realToday()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(!obj.data||!obj.__v){toast('Not a valid backup');return;}S=obj;save();refresh();toast('Data imported');}catch(err){toast('Could not read file');}};
    rd.readAsText(f);};
  inp.click();
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.getAttribute('data-act');
  const id=el.getAttribute('data-id');
  const i=el.getAttribute('data-i');
  const v=el.getAttribute('data-v');
  const date=el.getAttribute('data-date');
  const D=()=>ensureDay(S.sel);

  switch(act){
    case 'nav':{S.view=el.getAttribute('data-view');$('rail').classList.remove('open');save();refresh();break;}
    case 'menu':{$('rail').classList.toggle('open');break;}
    case 'goto-timer':{S.view='deepwork';save();refresh();break;}

    /* date nav */
    case 'date-prev':mutate(()=>{S.sel=clampDate(addD(S.sel,-1),PERIOD.start,PERIOD.end);});break;
    case 'date-next':mutate(()=>{S.sel=clampDate(addD(S.sel,1),PERIOD.start,PERIOD.end);});break;
    case 'date-today':mutate(()=>{S.sel=clampDate(realToday(),PERIOD.start,PERIOD.end);MONTH_CURSOR=iso(new Date(pd(S.sel).getFullYear(),pd(S.sel).getMonth(),1));});break;
    case 'week-prev':mutate(()=>{S.sel=clampDate(addD(weekStart(S.sel),-1),PERIOD.start,PERIOD.end);});break;
    case 'week-next':mutate(()=>{S.sel=clampDate(addD(weekStart(S.sel),7),PERIOD.start,PERIOD.end);});break;
    case 'month-prev':mutate(()=>{const c=pd(MONTH_CURSOR);MONTH_CURSOR=iso(new Date(c.getFullYear(),c.getMonth()-1,1));});break;
    case 'month-next':mutate(()=>{const c=pd(MONTH_CURSOR);MONTH_CURSOR=iso(new Date(c.getFullYear(),c.getMonth()+1,1));});break;
    case 'month-today':mutate(()=>{MONTH_CURSOR=iso(new Date(new Date().getFullYear(),new Date().getMonth(),1));});break;
    case 'open-day':if(date)mutate(()=>{S.sel=date;S.view='today';});break;

    /* day toggles */
    case 'top3':mutate(()=>{const d=D();d.top3[+i].done=!d.top3[+i].done;});break;
    case 'block':mutate(()=>{const d=D();const b=d.blocks.find(x=>x.id===id);if(b&&!b.locked)b.done=!b.done;});break;
    case 'chk':mutate(()=>{const d=D();d.checklist[+i].done=!d.checklist[+i].done;});break;
    case 'dw':mutate(()=>{const d=D();d.deepwork[+i].done=!d.deepwork[+i].done;});break;
    case 'rating':mutate(()=>{const d=D();d.reflection.rating=(+v===d.reflection.rating?0:+v);});break;
    case 'log-arrows':{const val=parseInt($('arrowsIn').value||'0',10);mutate(()=>{D().arrows=isNaN(val)?0:val;});toast('Arrows saved');break;}

    /* milestones */
    case 'neuro-ms':mutate(()=>{const m=S.data.research.neuro.milestones.find(x=>x.id===id);m.done=!m.done;});break;
    case 'atlas-ms':mutate(()=>{const m=S.data.research.atlas.milestones.find(x=>x.id===id);m.done=!m.done;});break;
    case 'adaptive-ms':mutate(()=>{const m=S.data.adaptive.milestones.find(x=>x.id===id);m.done=!m.done;});break;
    case 'mcri-ms':mutate(()=>{const m=S.data.mcri.milestones.find(x=>x.id===id);m.done=!m.done;});break;
    case 'prep':mutate(()=>{const p=S.data.research.prep.find(x=>x.id===id);p.done=!p.done;});break;

    /* mastery segments */
    case 'weakness':mutate(()=>{const w=S.data.sat.weaknesses.find(x=>x.id===id);w.level=(+v===w.level?+v-1:+v);});break;
    case 'bio-topic':mutate(()=>{const t=S.data.bio.topics.find(x=>x.id===id);t.level=(+v===t.level?+v-1:+v);});break;
    case 'mcot-cur':mutate(()=>{const s=S.data.mcot.subjects.find(x=>x.id===id);const nv=+v*20;s.curriculum=(s.curriculum===nv?nv-20:nv);});break;
    case 'mcot-res':mutate(()=>{const s=S.data.mcot.subjects.find(x=>x.id===id);const nv=+v*20;s.resources=(s.resources===nv?nv-20:nv);});break;
    case 'mcot-vid':mutate(()=>{const s=S.data.mcot.subjects.find(x=>x.id===id);const nv=+v*20;s.video=(s.video===nv?nv-20:nv);});break;

    /* vocab */
    case 'vocab':mutate(()=>{const w=S.data.sat.vocab.find(x=>x.id===id);w.known=!w.known;});break;

    /* habits */
    case 'hab':if(date)mutate(()=>{const k=habKey(date,id);if(S.habitLog[k])delete S.habitLog[k];else S.habitLog[k]=true;});break;

    /* adaptive impact tasks */
    case 'imp':{const k=el.getAttribute('data-k');mutate(()=>{impSet(k,!impOn(k));});break;}

    /* publications */
    case 'pub-step':mutate(()=>{const p=S.data.pubs.find(x=>x.id===id);p.cur=(p.cur===+i?Math.max(0,+i-1):+i);});break;

    /* timer */
    case 'timer-toggle':{TIMER.running=!TIMER.running;refresh();break;}
    case 'timer-reset':{TIMER.running=false;S.timer.remaining=S.timer.length;save();refresh();break;}
    case 'timer-set':{const mn=+el.getAttribute('data-min');S.timer.length=mn*60;S.timer.remaining=mn*60;TIMER.running=false;save();refresh();break;}

    /* modals + data */
    case 'add-test':modalTest();break;
    case 'add-session':modalSession();break;
    case 'modal-close':closeModal();break;
    case 'save-test':{
      const dt=$('mt_date').value||realToday();const rw=parseInt($('mt_rw').value||'0',10);const ma=parseInt($('mt_math').value||'0',10);
      const kind=$('mt_kind').value||'Practice test';
      if(!rw||!ma){toast('Enter both RW and Math');break;}
      mutate(()=>{S.data.sat.tests.push({id:'t'+Date.now(),date:dt,rw,math:ma,total:rw+ma,kind});S.data.sat.tests.sort((a,b)=>a.date<b.date?-1:1);});
      closeModal();toast('Test logged');break;}
    case 'save-session':{
      const dt=$('ms_date').value||realToday();const ar=parseInt($('ms_arrows').value||'0',10);const sc=parseInt($('ms_score').value||'0',10);
      const note=$('ms_note').value||'';
      if(!sc){toast('Enter a score');break;}
      mutate(()=>{S.data.archery.sessions.push({id:'s'+Date.now(),date:dt,arrows:isNaN(ar)?0:ar,score:sc,note});S.data.archery.sessions.sort((a,b)=>a.date<b.date?-1:1);});
      closeModal();toast('Session logged');break;}
    case 'reset':modalReset();break;
    case 'confirm-reset':{Store.wipe();S=freshState();S.__v=VERSION;save();closeModal();refresh();toast('Reset complete');break;}
    case 'export':exportData();break;
    case 'import':importData();break;
    case 'data':modalData();break;
    case 'restore-bak':restoreBackup(el.getAttribute('data-t'));break;
    case 'persist-now':requestPersist().then(()=>{toast(storagePersisted?'Storage protected':'Browser declined');modalData();});break;
    case 'install':{if(deferredPrompt){const dp=deferredPrompt;dp.prompt();dp.userChoice.finally(()=>{deferredPrompt=null;renderTop();});}else{toast('Use the browser menu to install');}break;}
  }
});

/* textarea binds (reflection + weekly) · no full refresh, keep focus */
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-bind]');if(!el)return;
  const path=el.getAttribute('data-bind').split('.');
  if(path[0]==='reflection'){ensureDay(S.sel).reflection[path[1]]=el.value;save();}
  else if(path[0]==='weekly'){const ws=path[1];if(!S.weekly[ws])S.weekly[ws]={wins:'',fails:''};S.weekly[ws][path[2]]=el.value;save();}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ============================================================
   PWA + DATA SAFETY
   ============================================================ */
let deferredPrompt=null;
let storagePersisted=false;

async function requestPersist(){
  try{
    if(navigator.storage&&navigator.storage.persisted){
      storagePersisted=await navigator.storage.persisted();
      if(!storagePersisted&&navigator.storage.persist){
        storagePersisted=await navigator.storage.persist();
      }
    }
  }catch(e){}
  return storagePersisted;
}

/* rolling in-storage snapshots — a safety net under the main save */
const BAK_KEY=VERSION+'::backups';
const BAK_MAX=6;
const BAK_GAP=4*60*1000;
let lastBakAt=0;
function loadBackups(){try{const v=localStorage.getItem(BAK_KEY);return v?JSON.parse(v):[];}catch(e){return [];}}
function saveBackups(a){try{localStorage.setItem(BAK_KEY,JSON.stringify(a));}catch(e){}}
function maybeBackup(force){
  const now=Date.now();
  if(!force&&now-lastBakAt<BAK_GAP)return;
  lastBakAt=now;
  const arr=loadBackups();
  arr.push({t:new Date().toISOString(),data:S});
  while(arr.length>BAK_MAX)arr.shift();
  saveBackups(arr);
}
function restoreBackup(t){
  const b=loadBackups().find(x=>x.t===t);if(!b)return;
  S=b.data;S.__v=VERSION;save();refresh();closeModal();
  toast('Restored snapshot');
}
function fmtStamp(isoStr){const d=new Date(isoStr);return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}

function modalData(){
  const arr=loadBackups().slice().reverse();
  const baks=arr.length?arr.map(b=>
    '<div class="flex ac jb" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="note">'+fmtStamp(b.t)+'</span>'+
    '<button class="btn sm ghost" data-act="restore-bak" data-t="'+b.t+'">Restore</button></div>').join('')
    :'<div class="note" style="padding:8px 0">No snapshots yet. They start saving automatically as you use the app.</div>';
  const dayCount=Object.keys(S.days).length;
  openModal(
    '<h3>Data and backups</h3>'+
    '<div class="msub">Everything is saved on this device automatically. Nothing is lost when you close the app.</div>'+
    '<div class="kvs" style="margin-bottom:14px">'+
      '<div class="kv"><span class="k">Protected storage</span><span class="v" style="color:'+(storagePersisted?'var(--ok)':'var(--warn)')+'">'+(storagePersisted?'granted':'not yet')+'</span></div>'+
      '<div class="kv"><span class="k">Days with edits</span><span class="v">'+dayCount+'</span></div>'+
      '<div class="kv"><span class="k">Snapshots kept</span><span class="v">'+arr.length+' / '+BAK_MAX+'</span></div>'+
    '</div>'+
    (!storagePersisted?'<button class="btn sm gold" data-act="persist-now" style="width:100%;justify-content:center;margin-bottom:14px">Protect storage on this device</button>':'')+
    '<label class="fl">Restore a recent snapshot</label>'+
    '<div style="max-height:168px;overflow-y:auto;margin-bottom:14px">'+baks+'</div>'+
    '<div class="flex gap8"><button class="btn sm" data-act="export" style="flex:1;justify-content:center">'+ic('export',13)+' Export file</button>'+
    '<button class="btn sm ghost" data-act="import" style="flex:1;justify-content:center">'+ic('import',13)+' Import file</button></div>'+
    '<div class="divider"></div>'+
    '<div class="flex ac jb"><span class="note">Wipe everything, start fresh.</span>'+
    '<button class="btn sm" style="border-color:var(--bad);color:var(--bad)" data-act="reset">Reset</button></div>'
  );
}

/* service worker for offline + installability */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderTop();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('Installed');renderTop();});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  ensureDay(S.sel);
  refresh();
  if(S.view==='countdown')refreshCountdowns();
  requestPersist().then(()=>{renderTop();});
  maybeBackup(true);
}
init();
</script>
